<style>
/* Layout: a soft "papaya" hero with floating bubbles, a row of stat bubbles, then one rounded bubble per training day. */
:root {
  --bg: #fff5f1;
  --surface: #ffffff;
  --ink: #33202f;
  --muted: #7d6576;
  --papaya: #ff7a59;
  --papaya-soft: #ffe1d6;
  --papaya-ink: #b8401f;
  --leaf: #2fae80;
  --leaf-soft: #d6f5e8;
  --sky: #7cb8ff;
  --sky-soft: #e2efff;
  --berry: #c9478d;
  --berry-soft: #fbe1ef;
  --line: #f1d3c8;
  --shadow: 0 10px 30px -14px rgba(201, 71, 141, .35);
  --display: "Fredoka", "Baloo 2", ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d1420; --surface: #2a1e2d; --ink: #fbe9ef; --muted: #c4a9bb;
    --papaya: #ff8f6f; --papaya-soft: #4a2a27; --papaya-ink: #ffb59f;
    --leaf: #4fd6a4; --leaf-soft: #1f3a31; --sky: #8ec3ff; --sky-soft: #22304a;
    --berry: #f07ab9; --berry-soft: #43233a; --line: #45313f;
    --shadow: 0 10px 30px -14px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1d1420; --surface: #2a1e2d; --ink: #fbe9ef; --muted: #c4a9bb;
  --papaya: #ff8f6f; --papaya-soft: #4a2a27; --papaya-ink: #ffb59f;
  --leaf: #4fd6a4; --leaf-soft: #1f3a31; --sky: #8ec3ff; --sky-soft: #22304a;
  --berry: #f07ab9; --berry-soft: #43233a; --line: #45313f;
  --shadow: 0 10px 30px -14px rgba(0,0,0,.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1480px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 56px; display: grid; gap: 28px; }

/* Hero */
.hero { position: relative; overflow: hidden; border-radius: 36px; padding: 32px clamp(20px, 4vw, 44px);
  background: radial-gradient(120% 140% at 0% 0%, var(--papaya-soft), transparent 60%), radial-gradient(90% 120% at 100% 100%, var(--berry-soft), transparent 60%), var(--surface);
  box-shadow: var(--shadow); display: grid; gap: 14px; }
.bubble-deco { position: absolute; border-radius: 50%; opacity: .55; pointer-events: none; animation: float 9s ease-in-out infinite; }
.bubble-deco.b1 { width: 120px; height: 120px; right: 6%; top: -30px; background: var(--papaya); opacity: .25; }
.bubble-deco.b2 { width: 54px; height: 54px; right: 22%; top: 60px; background: var(--sky); opacity: .35; animation-delay: -3s; }
.bubble-deco.b3 { width: 80px; height: 80px; right: 2%; bottom: -24px; background: var(--leaf); opacity: .25; animation-delay: -5s; }
.bubble-deco.b4 { width: 22px; height: 22px; right: 32%; bottom: 26px; background: var(--berry); opacity: .4; animation-delay: -1s; }
@keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
@media (prefers-reduced-motion: reduce) { .bubble-deco { animation: none; } }
.eyebrow { font-weight: 800; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--berry); position: relative; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(34px, 6vw, 56px); line-height: 1.02; margin: 0; text-wrap: balance; position: relative; }
h1 .squish { color: var(--papaya); }
.sub { color: var(--muted); font-size: 16px; margin: 0; max-width: 60ch; position: relative; }
.source { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.live { background: var(--leaf); box-shadow: 0 0 0 4px var(--leaf-soft); }
.dot.warn { background: var(--papaya); box-shadow: 0 0 0 4px var(--papaya-soft); }
.btn { font: inherit; font-weight: 800; font-size: 13px; border: 0; border-radius: 999px; padding: 6px 14px; cursor: pointer; background: var(--papaya); color: #fff; }
.btn:focus-visible, .wk:focus-visible, summary:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }

/* Week picker */
.weeks { display: flex; flex-wrap: wrap; gap: 8px; position: relative; }
.wk { font: inherit; font-family: var(--display); font-weight: 600; font-size: 15px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); padding: 6px 16px; border-radius: 999px; cursor: pointer; }
.wk[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.blocks { display: flex; gap: 6px; margin-bottom: 8px; }
.blocks .wk { font-size: 12px; padding: 3px 12px; }
.wk small { font-family: var(--body); font-weight: 700; font-size: 11px; color: inherit; opacity: .7; margin-left: 4px; }

/* Stat bubbles */
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.stat { border-radius: 28px; padding: 18px 20px; display: grid; gap: 2px; }
.stat:nth-child(1) { background: var(--papaya-soft); }
.stat:nth-child(2) { background: var(--leaf-soft); }
.stat:nth-child(3) { background: var(--sky-soft); }
.stat:nth-child(4) { background: var(--berry-soft); }
.stat b { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-weight: 700; font-size: 13px; color: var(--muted); }
.stat { grid-auto-flow: column; justify-content: start; gap: 28px; }
.stat-part { display: grid; gap: 2px; }
.stat-part + .stat-part { padding-left: 28px; border-left: 2px dashed color-mix(in srgb, var(--muted) 35%, transparent); }
.hoverable { cursor: help; border-radius: 16px; transition: box-shadow .15s ease; }
.hoverable:hover, .hoverable:focus-visible, .hoverable.on { box-shadow: 0 0 0 2px var(--sky); outline: none; }
#pop { position: fixed; z-index: 10; width: min(320px, calc(100vw - 32px)); max-height: 70vh; overflow-y: auto; background: var(--surface); color: var(--ink);
  border-radius: 22px; padding: 14px 16px; box-shadow: 0 18px 40px -12px rgba(0,0,0,.35), 0 0 0 2px var(--line); font-size: 13px; display: grid; gap: 10px; }
#pop h3 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 16px; }
#pop .wkrow { display: grid; gap: 2px; padding-top: 8px; border-top: 2px dashed var(--line); }
#pop .wkrow:first-of-type { border-top: 0; padding-top: 0; }
#pop .wklab { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--berry); }
#pop .val { font-weight: 700; color: var(--papaya-ink); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
#pop .dim { color: var(--muted); }
#pop ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.split { display: flex; align-items: center; gap: 8px; margin: 8px 2px 2px; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--berry); }
.split::after { content: ""; flex: 1; border-top: 2px dashed var(--line); }
.part { font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.slot-empty { background: transparent; border: 2px dashed var(--line); }
.progress { height: 14px; border-radius: 999px; background: var(--surface); box-shadow: inset 0 0 0 2px var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--papaya), var(--berry)); transition: width .6s ease; }

/* Sections */
h2 { font-family: var(--display); font-weight: 600; font-size: 26px; margin: 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
h2 .count { font-family: var(--body); font-size: 13px; font-weight: 800; background: var(--surface); border: 2px solid var(--line); color: var(--muted); border-radius: 999px; padding: 2px 10px; }
section { display: grid; gap: 14px; }
.board-scroll { overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 14px; margin-inline: -4px; padding-inline: 4px; }
.board { display: grid; grid-template-columns: repeat(7, minmax(180px, 1fr)); gap: 12px; align-items: stretch; }
.board > .day { scroll-snap-align: start; align-content: start; }
.empty { color: var(--muted); background: var(--surface); border: 2px dashed var(--line); border-radius: 28px; padding: 20px; margin: 0; }

/* Day bubble */
.day { background: var(--surface); border-radius: 26px; padding: 14px; display: grid; gap: 12px; min-width: 0; box-shadow: var(--shadow); border: 2px solid transparent; }
.day.done { border-color: var(--papaya-soft); }
.day.planned { box-shadow: none; border: 2px dashed var(--line); }
.day.today { border: 2px solid var(--berry); }
.day-head { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 4px 10px; }
.num { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; flex: none; font-family: var(--display); font-weight: 700; line-height: 1; text-align: center; }
.num small { display: block; font-family: var(--body); font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.done .num { background: var(--papaya); color: #fff; }
.planned .num { background: var(--sky-soft); color: var(--ink); }
.rest .num { background: var(--leaf-soft); color: var(--ink); }
.day-title { display: grid; min-width: 0; }
.day-title strong { font-family: var(--display); font-weight: 600; font-size: 17px; line-height: 1.2; }
.day-title span { font-size: 13px; color: var(--muted); font-weight: 700; }
.pill { grid-column: 1 / -1; justify-self: start; flex: none; font-size: 12px; font-weight: 800; border-radius: 999px; padding: 4px 11px; white-space: nowrap; }
.pill.done { background: var(--leaf-soft); color: var(--leaf); }
.pill.next { background: var(--sky-soft); color: var(--ink); }
.pill.today { background: var(--berry); color: #fff; }
.pill.missed { background: var(--papaya-soft); color: var(--papaya-ink); }
.pill.rest { background: var(--leaf-soft); color: var(--ink); }
.runs { display: flex; flex-wrap: wrap; gap: 8px; }
.run { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: 13px; padding: 5px 12px; border-radius: 999px; background: var(--leaf-soft); color: var(--ink); }
.run.plan { background: transparent; border: 2px dashed var(--line); color: var(--muted); }
.run em { font-style: normal; font-weight: 600; color: var(--muted); }
.moves { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.move { display: grid; gap: 2px; padding: 8px 11px; border-radius: 16px; font-size: 14px; background: var(--bg); min-width: 0; }
.move-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.move-name { font-weight: 800; }
.sets { font-size: 12px; font-weight: 800; color: var(--berry); font-variant-numeric: tabular-nums; }
.got { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--papaya-ink); overflow-wrap: anywhere; }
.got::before { content: "✓ "; color: var(--leaf); }
.note { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.note.mine { color: var(--ink); font-style: italic; }
.beat { font-size: 12px; font-weight: 700; color: var(--muted); overflow-wrap: anywhere; }
.beat b { color: var(--berry); font-weight: 800; }

footer { font-size: 12px; color: var(--muted); text-align: center; }
/* Phones: the header keeps its size; the week buttons fit one row and the board is compact, about four days across. */
@media (max-width: 600px) {
  .weeks { flex-wrap: nowrap; gap: 6px; }
  .wk { font-size: 13px; padding: 5px 10px; white-space: nowrap; }
  .wk small { font-size: 9px; margin-left: 2px; }
  .blocks .wk { font-size: 11px; padding: 2px 10px; }
  .board-scroll { padding-bottom: 8px; }
  .board { grid-template-columns: none !important; grid-auto-flow: column; grid-auto-columns: calc((100vw - 32px - 15px) / 4); gap: 5px; }
  .day { padding: 6px; gap: 6px; border-radius: 14px; }
  .day-head { grid-template-columns: 1fr; justify-items: start; gap: 2px; }
  .num { width: 30px; height: 30px; font-size: 13px; }
  .num small { font-size: 7px; letter-spacing: .04em; }
  .day-title strong { font-size: 12px; }
  .day-title span { font-size: 10px; }
  .runs { gap: 4px; }
  .run { font-size: 10px; padding: 3px 6px; gap: 3px; flex-wrap: wrap; }
  .moves { gap: 4px; }
  .move { padding: 4px 5px; border-radius: 9px; font-size: 10.5px; line-height: 1.25; gap: 1px; }
  .move-top { gap: 1px 4px; }
  .sets, .beat, .note, .part { font-size: 9px; }
  .split { font-size: 8px; margin: 4px 0 0; gap: 4px; }
  .hoverable { border-radius: 9px; }
}
@media (max-width: 480px) { .hero { border-radius: 28px; padding: 24px 18px; } .stat b { font-size: 28px; } }
</style>

    <h1 id="headline">This week, <span class="squish">so far</span></h1>

  <div class="stats" id="stats"></div>

  <section>
    <h2>The week</h2>
    <div class="board-scroll"><div class="board" id="board"></div></div>

  </details>
</div>

}
function hidePop() { pop.hidden = true; if (popFor) popFor.classList.remove("on"); popFor = null; }
const hov = e => e.target.closest && e.target.closest(".hoverable");
document.addEventListener("mouseover", e => { const el = hov(e); if (el && matchMedia("(hover: hover)").matches) showPop(el); });
document.addEventListener("mouseout", e => { const el = hov(e); if (el && !el.contains(e.relatedTarget) && matchMedia("(hover: hover)").matches) hidePop(); });
document.addEventListener("focusin", e => { const el = hov(e); if (el) showPop(el); });
document.addEventListener("focusout", e => { if (hov(e)) hidePop(); });
document.addEventListener("click", e => { const el = hov(e); if (el) { el === popFor && !pop.hidden ? hidePop() : showPop(el); } else if (!pop.contains(e.target)) hidePop(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") hidePop(); });
addEventListener("scroll", hidePop, { passive: true });
$("board").addEventListener("scroll", hidePop, { passive: true });

load(b64ToText(SNAPSHOT_B64));
setSource("", snapshotNote);

// Live data from Google Drive
(async () => {
  const mcp = await window.claude?.use?.("mcp").catch(() => null);
  if (!mcp) return;
  setSource("", `${snapshotNote} Checking Google Drive…`);
  const apply = (result) => {
    let p = result && result.payload;
    if (typeof p === "string") { try { p = JSON.parse(p); } catch { p = { content: p }; } }
    const b64 = p && (p.content || p.data);
    if (!b64 || !load(b64ToText(b64))) { setSource("warn", `${snapshotNote} Your Drive sheet came back in a shape this page couldn't read.`); return; }
    const at = result.cache ? new Date(result.cache.storedAt) : new Date();
    setSource("live", `Live from your Google Drive sheet · checked ${at.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })}`);
  };
  const askOnce = () => mcp.callTool(DRIVE.server, DRIVE.tool, DRIVE.input).then(apply).catch(onError);
  function onError(err) {
    const code = err && err.code;
    if (code === "needs_reauth") setSource("warn", `${snapshotNote} Reconnect Google Drive in claude.ai Settings → Connectors to see live updates.`);
    else if (code === "server_not_connected" || code === "selection_required" || code === "server_not_found") setSource("warn", `${snapshotNote} Add Google Drive in claude.ai Settings → Connectors to see live updates.`);
    else if (code === "approval_required" || code === "not_in_manifest" || code === "consent_required") {
      setSource("warn", `${snapshotNote} <button class="btn" id="allow">Load live from Drive</button>`);
      $("allow").onclick = askOnce;
    }
    else if (code === "not_granted" || code === "capability_disabled" || code === "capability_removed") setSource("", snapshotNote);
    else if (code === "tool_error") setSource("warn", `${snapshotNote} Google Drive said: ${esc(err.message || "the file couldn't be read")}.`);
    else setSource("warn", `${snapshotNote} Couldn't reach Google Drive just now; it will try again shortly.`);
  }
  mcp.watchTool(DRIVE.server, DRIVE.tool, DRIVE.input, ev => {
    if (ev.type === "data") apply(ev.result);
    else if (ev.error && ev.error.code === "bad_request") askOnce();
    else onError(ev.error);
  }, { cache: { staleTime: 60000 }, refetchInterval: 300000 });
})();
</script>
